<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>AI Financial Dashboard</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--surface:#f5f5f3;--border:rgba(0,0,0,.1);
  --text:#1a1a1a;--muted:#666;--hint:#999;
  --up:#1a9e75;--down:#d85a30;--accent:#185fa5;--accent-bg:#e6f1fb;
  --r-md:8px;--r-lg:12px;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'SFMono-Regular','Cascadia Mono','Consolas',monospace;
}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a1a;--surface:#242424;--border:rgba(255,255,255,.1);--text:#e8e8e8;--muted:#aaa;--hint:#666;--accent-bg:#0c2540}}
body{font-family:var(--sans);background:var(--bg);color:var(--text);padding:24px 20px;max-width:900px;margin:0 auto;line-height:1.6}
h1{font-size:20px;font-weight:500;margin-bottom:4px}
.subtitle{font-size:13px;color:var(--muted);margin-bottom:20px}
.section-label{font-size:11px;font-weight:500;color:var(--hint);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.market-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:20px}
.market-card{background:var(--surface);border-radius:var(--r-md);padding:12px 14px}
.mc-name{font-size:11px;color:var(--muted);margin-bottom:4px}
.mc-price{font-size:17px;font-weight:500;font-family:var(--mono)}
.mc-chg{font-size:12px;font-weight:500;margin-top:2px}
.mc-up{color:var(--up)}.mc-dn{color:var(--down)}
.brief-btn{display:flex;align-items:center;gap:8px;padding:10px 20px;border-radius:var(--r-md);background:var(--accent);color:#fff;border:none;font-size:14px;font-weight:500;font-family:var(--sans);cursor:pointer;margin-bottom:20px;transition:opacity .15s}
.brief-btn:hover{opacity:.85}.brief-btn:disabled{opacity:.5;cursor:not-allowed}
.brief-panel{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px 24px;margin-bottom:20px;display:none}
.brief-panel.visible{display:block}
.brief-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.brief-badge{font-size:11px;font-weight:500;background:var(--accent-bg);color:var(--accent);padding:3px 10px;border-radius:var(--r-md)}
.brief-content{font-size:13px;color:var(--muted);line-height:1.8}
.brief-content h3{font-size:13px;font-weight:600;color:var(--text);margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.brief-content h3:first-child{margin-top:0}
.brief-content p{margin-bottom:6px}
.search-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.market-toggle{display:flex;gap:4px}
.mkt-btn{padding:0 14px;height:36px;font-size:13px;border-radius:var(--r-md);border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:var(--sans);transition:all .15s}
.mkt-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type="text"]{flex:1;min-width:160px;height:36px;padding:0 12px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;text-transform:uppercase}
input[type="text"]:focus{outline:none;border-color:var(--accent)}
button.search-btn{height:36px;padding:0 18px;border-radius:var(--r-md);border:none;background:var(--accent);color:#fff;cursor:pointer;font-size:13px;font-family:var(--sans)}
button.search-btn:disabled{opacity:.5;cursor:not-allowed}
.quick-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.row-label{font-size:10px;color:var(--hint);letter-spacing:.06em;white-space:nowrap;min-width:40px}
.q-btn{font-size:12px;padding:4px 12px;border-radius:var(--r-md);border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:var(--mono);transition:all .15s}
.q-btn:hover{background:var(--surface);color:var(--text)}
.q-btn.recent{border-color:var(--accent);color:var(--accent)}
.stock-header{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 20px;margin-bottom:12px;display:none}
.stock-header.visible{display:block}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px}
.sh-name{font-size:20px;font-weight:500}
.sh-ticker{font-size:13px;color:var(--muted);margin-top:2px;font-family:var(--mono)}
.sh-price{font-size:28px;font-weight:500;font-family:var(--mono);text-align:right}
.sh-chg-row{font-size:13px;font-weight:500;font-family:var(--mono);text-align:right;margin-top:2px}
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-top:14px}
.metric-cell{background:var(--surface);border-radius:var(--r-md);padding:8px 10px}
.m-label{font-size:10px;color:var(--hint);margin-bottom:3px}
.m-val{font-size:13px;font-weight:500;font-family:var(--mono)}
.chart-area{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 20px;margin-bottom:12px;display:none}
.chart-area.visible{display:block}
.factor-grid{display:none;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.factor-grid.visible{display:grid}
.factor-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 14px}
.fc-title{font-size:11px;color:var(--hint);margin-bottom:8px}
.fc-score{font-size:22px;font-weight:500;font-family:var(--mono)}
.fc-bar-bg{height:3px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden}
.fc-bar-fill{height:100%;border-radius:2px;transition:width .6s ease}
.fc-label{font-size:11px;margin-top:5px;color:var(--muted)}
.inst-panel{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 20px;margin-bottom:12px;display:none}
.inst-panel.visible{display:block}
.inst-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}
.inst-card{background:var(--surface);border-radius:var(--r-md);padding:10px 12px}
.inst-name{font-size:11px;color:var(--hint);margin-bottom:6px}
.inst-net{font-size:18px;font-weight:500;font-family:var(--mono)}
.inst-detail{font-size:11px;color:var(--muted);margin-top:3px}
.inst-total{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.ai-panel{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 20px;margin-bottom:12px;display:none}
.ai-panel.visible{display:block}
.ai-header{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.ai-badge{font-size:11px;font-weight:500;background:var(--accent-bg);color:var(--accent);padding:3px 10px;border-radius:var(--r-md)}
.ai-title{font-size:14px;font-weight:500}
.ai-output{font-size:13px;color:var(--muted);line-height:1.75}
.ai-output p{margin-bottom:8px}
.verdict-row{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--border)}
.verdict-badge{font-size:12px;font-weight:500;padding:4px 14px;border-radius:var(--r-md)}
.v-bull{background:#eaf3de;color:#3b6d11}.v-bear{background:#fcebeb;color:#a32d2d}.v-neu{background:var(--surface);color:var(--muted)}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-msg{font-size:12px;color:#a32d2d;padding:8px 0;display:none}
#jsCheck{font-size:12px;color:var(--up);padding:6px 12px;background:#eaf3de;border-radius:var(--r-md);margin-bottom:16px;display:none}
</style>
</head>
<body>

<h1>AI Financial Dashboard</h1>
<p class="subtitle">Yahoo Finance x Finnhub x Claude AI</p>
<div id="jsCheck">JS 執行正常</div>

<p class="section-label">全球市場概覽</p>
<div class="market-grid" id="marketGrid"><div class="market-card"><div class="mc-name">載入中...</div></div></div>

<button class="brief-btn" id="briefBtn" onclick="generateBriefing()">產生今日盤前簡報 (OUST)</button>
<div id="briefPanel" class="brief-panel">
  <div class="brief-header">
    <div style="display:flex;align-items:center;gap:8px">
      <span class="brief-badge">Claude AI + Finnhub</span>
      <span style="font-size:14px;font-weight:500">今日盤前簡報</span>
    </div>
    <span style="font-size:11px;color:var(--hint)" id="briefTime"></span>
  </div>
  <div class="brief-content" id="briefContent"></div>
</div>

<p class="section-label">個股查詢</p>
<div class="search-row">
  <div class="market-toggle">
    <button class="mkt-btn active" id="btnUS" onclick="setMarket('US')">美股</button>
    <button class="mkt-btn" id="btnTW" onclick="setMarket('TW')">台股</button>
  </div>
  <input type="text" id="tickerInput" placeholder="輸入代號，如 AAPL / NVDA"/>
  <button class="search-btn" id="searchBtn" onclick="loadStock()">查詢</button>
</div>

<div class="quick-row">
  <span class="row-label">最近查詢</span>
  <span id="recentBtns" style="display:flex;gap:6px;flex-wrap:wrap"><span style="font-size:11px;color:var(--hint)">尚無記錄</span></span>
</div>
<div class="quick-row" style="margin-bottom:20px">
  <span class="row-label">常用個股</span>
  <button class="q-btn" onclick="quickLoad('AAPL')">AAPL</button>
  <button class="q-btn" onclick="quickLoad('NVDA')">NVDA</button>
  <button class="q-btn" onclick="quickLoad('TSLA')">TSLA</button>
  <button class="q-btn" onclick="quickLoad('MSFT')">MSFT</button>
  <button class="q-btn" onclick="quickLoad('META')">META</button>
  <button class="q-btn" onclick="quickLoad('MU')">MU</button>
  <button class="q-btn" onclick="quickLoad('AAOI')">AAOI</button>
  <button class="q-btn" onclick="quickLoad('OUST')">OUST</button>
  <button class="q-btn" onclick="setMarket('TW');quickLoad('2330.TW')">2330</button>
  <button class="q-btn" onclick="setMarket('TW');quickLoad('2317.TW')">2317</button>
  <button class="q-btn" onclick="setMarket('TW');quickLoad('2313.TW')">2313</button>
</div>

<div id="errorMsg" class="error-msg"></div>

<div id="stockHeader" class="stock-header">
  <div class="sh-top">
    <div><div class="sh-name" id="stockName"></div><div class="sh-ticker" id="stockTicker"></div></div>
    <div><div class="sh-price" id="stockPrice"></div><div class="sh-chg-row" id="stockChg"></div></div>
  </div>
  <div class="metrics-grid" id="metricsGrid"></div>
</div>

<div id="chartArea" class="chart-area">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
    <p class="section-label" style="margin:0">K線圖 + 成交量</p>
    <div style="display:flex;gap:4px">
      <button class="mkt-btn active" id="btn1d" onclick="switchKline('1d')">日K</button>
      <button class="mkt-btn" id="btn1wk" onclick="switchKline('1wk')">週K</button>
      <button class="mkt-btn" id="btn1mo" onclick="switchKline('1mo')">月K</button>
    </div>
  </div>
  <div id="priceChart" style="width:100%;height:260px"></div>
  <div id="volumeChart" style="width:100%;height:80px;margin-top:4px"></div>
</div>

<div id="factorGrid" class="factor-grid">
  <div class="factor-card"><div class="fc-title">技術面</div><div class="fc-score" id="fv-tech">-</div><div class="fc-bar-bg"><div class="fc-bar-fill" id="fb-tech" style="width:0%;background:#185fa5"></div></div><div class="fc-label" id="fl-tech">等待</div></div>
  <div class="factor-card"><div class="fc-title">量能</div><div class="fc-score" id="fv-vol">-</div><div class="fc-bar-bg"><div class="fc-bar-fill" id="fb-vol" style="width:0%;background:#1a9e75"></div></div><div class="fc-label" id="fl-vol">等待</div></div>
  <div class="factor-card"><div class="fc-title">法人動向</div><div class="fc-score" id="fv-inst">-</div><div class="fc-bar-bg"><div class="fc-bar-fill" id="fb-inst" style="width:0%;background:#993556"></div></div><div class="fc-label" id="fl-inst">等待</div></div>
  <div class="factor-card"><div class="fc-title">市場情緒</div><div class="fc-score" id="fv-sent">-</div><div class="fc-bar-bg"><div class="fc-bar-fill" id="fb-sent" style="width:0%;background:#ba7517"></div></div><div class="fc-label" id="fl-sent">等待</div></div>
  <div class="factor-card"><div class="fc-title">綜合評分</div><div class="fc-score" id="fv-overall">-</div><div class="fc-bar-bg"><div class="fc-bar-fill" id="fb-overall" style="width:0%;background:#534ab7"></div></div><div class="fc-label" id="fl-overall">等待</div></div>
</div>

<div id="instPanel" class="inst-panel">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
    <span style="font-size:11px;font-weight:500;background:#fff3e0;color:#b45309;padding:3px 10px;border-radius:8px">台股法人籌碼</span>
    <span style="font-size:14px;font-weight:500" id="instTitle"></span>
    <span style="font-size:11px;color:var(--hint);margin-left:auto" id="instDate"></span>
  </div>
  <div class="inst-grid" id="instGrid"></div>
  <div class="inst-total" id="instTotal"></div>
</div>

<div id="aiPanel" class="ai-panel">
  <div class="ai-header">
    <span class="ai-badge">Claude AI</span>
    <span class="ai-title" id="aiTitle">深度分析</span>
  </div>
  <div class="ai-output" id="aiOutput">等待查詢個股...</div>
</div>

<script>
// state
var currentMarket = 'US';
var lwChart = null;
var lwVolChart = null;
var currentInterval = '1d';
var currentTicker = null;
var recentTickers = [];

// confirm JS is running
document.getElementById('jsCheck').style.display = 'block';

// util
function computeEMA(data, period) {
  var k = 2 / (period + 1);
  var result = [];
  var ema = null;
  for (var i = 0; i < data.length; i++) {
    if (!data[i]) { result.push(null); continue; }
    ema = (ema === null) ? data[i] : data[i] * k + ema * (1 - k);
    result.push(parseFloat(ema.toFixed(4)));
  }
  return result;
}

function computeRSI(data, period) {
  var result = [];
  var i;
  for (i = 0; i < data.length; i++) result.push(null);
  var ag = 0, al = 0;
  for (i = 1; i <= period && i < data.length; i++) {
    var d = data[i] - data[i-1];
    if (d > 0) ag += d; else al += Math.abs(d);
  }
  ag /= period; al /= period;
  result[period] = al === 0 ? 100 : parseFloat((100 - 100/(1 + ag/al)).toFixed(1));
  for (i = period + 1; i < data.length; i++) {
    if (!data[i] || !data[i-1]) continue;
    var dd = data[i] - data[i-1];
    ag = (ag * (period-1) + (dd > 0 ? dd : 0)) / period;
    al = (al * (period-1) + (dd < 0 ? Math.abs(dd) : 0)) / period;
    result[i] = al === 0 ? 100 : parseFloat((100 - 100/(1 + ag/al)).toFixed(1));
  }
  return result;
}

function showError(msg) {
  var el = document.getElementById('errorMsg');
  el.style.display = msg ? 'block' : 'none';
  el.textContent = msg;
}

function getPrev(meta, closes) {
  return meta.regularMarketPreviousClose || meta.chartPreviousClose || closes[closes.length - 2];
}

function validArr(arr) {
  var out = [];
  for (var i = 0; i < arr.length; i++) { if (arr[i]) out.push(arr[i]); }
  return out;
}

// markets
function loadMarkets() {
  var names = ['S&P 500','NASDAQ','Dow Jones','Taiwan','Nikkei 225','Hang Seng'];
  var html = '';
  for (var i = 0; i < names.length; i++) {
    html += '<div class="market-card"><div class="mc-name">'+names[i]+'</div><div class="mc-price" style="font-size:13px;color:var(--muted)">Loading...</div><div class="mc-chg" style="color:var(--hint)">-</div></div>';
  }
  document.getElementById('marketGrid').innerHTML = html;
  fetch('/api/markets').then(function(r){ return r.json(); }).then(function(markets){
    var out = '';
    for (var i = 0; i < markets.length; i++) {
      var m = markets[i];
      if (!m.live || !m.price) {
        out += '<div class="market-card"><div class="mc-name">'+m.name+'</div><div class="mc-price" style="font-size:13px;color:var(--muted)">N/A</div><div class="mc-chg" style="color:var(--hint)">-</div></div>';
      } else {
        var up = m.chg >= 0;
        var ps = m.price >= 1000 ? m.price.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) : m.price.toFixed(2);
        out += '<div class="market-card"><div class="mc-name">'+m.name+'</div><div class="mc-price">'+ps+'</div><div class="mc-chg '+(up?'mc-up':'mc-dn')+'">'+(up?'up':'dn')+' '+Math.abs(m.chg).toFixed(2)+'%</div></div>';
      }
    }
    document.getElementById('marketGrid').innerHTML = out;
  }).catch(function(e){ console.error(e); });
}

// market toggle
function setMarket(m) {
  currentMarket = m;
  document.getElementById('btnUS').classList.toggle('active', m === 'US');
  document.getElementById('btnTW').classList.toggle('active', m === 'TW');
  document.getElementById('tickerInput').placeholder = m === 'TW' ? '台股代號，如 2330' : '美股代號，如 AAPL';
}

// recent
function addRecent(ticker, name) {
  var filtered = [];
  for (var i = 0; i < recentTickers.length; i++) {
    if (recentTickers[i].ticker !== ticker) filtered.push(recentTickers[i]);
  }
  filtered.unshift({ticker:ticker, name:name});
  if (filtered.length > 5) filtered = filtered.slice(0,5);
  recentTickers = filtered;
  var c = document.getElementById('recentBtns');
  var html = '';
  for (var i = 0; i < recentTickers.length; i++) {
    var r = recentTickers[i];
    var isTW = r.ticker.indexOf('.TW') !== -1;
    var fn = isTW ? "setMarket('TW');quickLoad('"+r.ticker+"')" : "setMarket('US');quickLoad('"+r.ticker+"')";
    html += '<button class="q-btn recent" onclick="'+fn+'">'+r.name+'</button>';
  }
  c.innerHTML = html;
}

function quickLoad(ticker) {
  if (ticker.indexOf('.TW') !== -1) setMarket('TW'); else setMarket('US');
  document.getElementById('tickerInput').value = ticker.replace('.TW','');
  loadStock(ticker);
}

// load stock
function loadStock(forceTicker) {
  var raw = (forceTicker || document.getElementById('tickerInput').value.trim()).toUpperCase();
  if (!raw) return;
  var ticker = raw;
  if (currentMarket === 'TW' && ticker.indexOf('.TW') === -1) ticker += '.TW';
  showError('');
  var btn = document.getElementById('searchBtn');
  btn.disabled = true; btn.textContent = 'Loading...';
  fetch('/api/stock?ticker=' + encodeURIComponent(ticker) + '&interval=1d')
    .then(function(r){ return r.json(); })
    .then(function(j){
      var data = parseYahoo(ticker, j);
      renderAll(data);
      btn.disabled = false; btn.textContent = 'Search';
    })
    .catch(function(e){
      showError('Error: ' + e.message);
      var mock = makeMock(ticker);
      renderAll(mock);
      btn.disabled = false; btn.textContent = 'Search';
    });
}

function parseYahoo(ticker, j) {
  var res = j.chart.result[0];
  var meta = res.meta;
  var q = res.indicators.quote[0];
  var ts = res.timestamp;
  var closes = q.close;
  var vc = validArr(closes);
  var current = meta.regularMarketPrice || vc[vc.length-1];
  var prev = getPrev(meta, vc);
  var vv = validArr(q.volume);
  var avgVol = 0;
  for (var i = 0; i < vv.length; i++) avgVol += vv[i];
  avgVol /= vv.length;
  var labels = [];
  for (var i = 0; i < ts.length; i++) {
    var d = new Date(ts[i]*1000);
    labels.push((d.getMonth()+1) + '/' + d.getDate());
  }
  return {
    ticker:ticker, isMock:false, name:meta.shortName||meta.symbol,
    currency:meta.currency||'USD', price:current,
    chgAbs:current-prev, chgPct:parseFloat(((current-prev)/prev*100).toFixed(2)),
    high52:meta.fiftyTwoWeekHigh, low52:meta.fiftyTwoWeekLow, pe:meta.trailingPE,
    avgVol:avgVol, latestVol:q.volume[q.volume.length-1],
    volRatio:q.volume[q.volume.length-1]/avgVol,
    labels:labels, closes:closes, volumes:q.volume,
    timestamps:ts, opens:q.open, highs:q.high, lows:q.low,
    ema20:computeEMA(closes,20),
    rsiLatest:validArr(computeRSI(closes,14)).slice(-1)[0]
  };
}

function makeMock(ticker) {
  var isTW = ticker.indexOf('.TW') !== -1;
  var base = isTW ? 200+Math.random()*300 : 50+Math.random()*300;
  var closes=[],volumes=[],labels=[],ts=[];
  var p = base;
  for (var i=30; i>=0; i--) {
    p *= (1+(Math.random()-0.48)*0.025);
    closes.push(p); volumes.push(Math.floor(Math.random()*50000000+5000000));
    var d = new Date(); d.setDate(d.getDate()-i);
    labels.push((d.getMonth()+1)+'/'+d.getDate());
    ts.push(Math.floor(d.getTime()/1000));
  }
  var cur = closes[closes.length-1], prv = closes[closes.length-2];
  var sum = 0; for (var i=0;i<volumes.length;i++) sum+=volumes[i];
  return {
    ticker:ticker, isMock:true, name:ticker.replace('.TW',''),
    currency:isTW?'TWD':'USD', price:cur,
    chgAbs:cur-prv, chgPct:parseFloat(((cur-prv)/prv*100).toFixed(2)),
    high52:Math.max.apply(null,closes)*1.05, low52:Math.min.apply(null,closes)*0.95,
    pe:(10+Math.random()*30).toFixed(1), avgVol:sum/volumes.length,
    latestVol:volumes[volumes.length-1], volRatio:volumes[volumes.length-1]/(sum/volumes.length),
    labels:labels, closes:closes, volumes:volumes, timestamps:ts,
    opens:closes.map(function(c){return c*(1+(Math.random()-0.5)*0.01);}),
    highs:closes.map(function(c){return c*(1+Math.random()*0.015);}),
    lows:closes.map(function(c){return c*(1-Math.random()*0.015);}),
    ema20:computeEMA(closes,20),
    rsiLatest:40+Math.random()*30
  };
}

// render
function renderAll(d) {
  renderHeader(d);
  renderChart(d);
  renderFactors(d);
  var name = d.ticker.indexOf('.TW')!==-1 ? d.ticker.replace('.TW','') : d.ticker;
  addRecent(d.ticker, name);
  if (d.ticker.indexOf('.TW') !== -1) {
    loadTWSE(d.ticker.replace('.TW',''));
  } else {
    document.getElementById('instPanel').classList.remove('visible');
  }
  runClaude(d);
}

function renderHeader(d) {
  var up = d.chgAbs >= 0;
  document.getElementById('stockName').textContent = d.name;
  document.getElementById('stockTicker').textContent = d.ticker + (d.isMock?' [mock]':' [live]');
  document.getElementById('stockPrice').style.color = up ? 'var(--up)' : 'var(--down)';
  document.getElementById('stockPrice').textContent = d.price.toFixed(2);
  document.getElementById('stockChg').className = 'sh-chg-row ' + (up?'mc-up':'mc-dn');
  document.getElementById('stockChg').textContent = (up?'up ':'dn ') + Math.abs(d.chgAbs).toFixed(2) + ' (' + Math.abs(d.chgPct).toFixed(2) + '%)';
  var e20 = validArr(d.ema20).slice(-1)[0] || 0;
  var metrics = [
    {l:'RSI(14)', v:d.rsiLatest?d.rsiLatest.toFixed(1):'-'},
    {l:'Vol Ratio', v:d.volRatio?d.volRatio.toFixed(2)+'x':'-'},
    {l:'52W High', v:d.high52?d.high52.toFixed(2):'-'},
    {l:'52W Low', v:d.low52?d.low52.toFixed(2):'-'},
    {l:'EMA20', v:e20.toFixed(2)},
    {l:'P/E', v:d.pe?parseFloat(d.pe).toFixed(1):'-'}
  ];
  var html = '';
  for (var i=0;i<metrics.length;i++) {
    html += '<div class="metric-cell"><div class="m-label">'+metrics[i].l+'</div><div class="m-val">'+metrics[i].v+'</div></div>';
  }
  document.getElementById('metricsGrid').innerHTML = html;
  document.getElementById('stockHeader').classList.add('visible');
}

// kline
function renderChart(d) {
  document.getElementById('chartArea').classList.add('visible');
  currentTicker = d.ticker;
  drawKline(d);
}

function switchKline(interval) {
  currentInterval = interval;
  var ids = ['btn1d','btn1wk','btn1mo'];
  var ivs = ['1d','1wk','1mo'];
  for (var i=0;i<ids.length;i++) {
    var el = document.getElementById(ids[i]);
    if (el) el.classList.toggle('active', ivs[i]===interval);
  }
  if (!currentTicker) return;
  document.getElementById('priceChart').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:12px;color:var(--muted)">Loading...</div>';
  fetch('/api/stock?ticker='+encodeURIComponent(currentTicker)+'&interval='+interval)
    .then(function(r){return r.json();})
    .then(function(j){
      var d = parseYahoo(currentTicker, j);
      drawKline(d);
    })
    .catch(function(e){
      document.getElementById('priceChart').innerHTML = '<div style="padding:20px;font-size:12px;color:var(--down)">Error: '+e.message+'</div>';
    });
}

function drawKline(d) {
  if (lwChart) { lwChart.remove(); lwChart=null; }
  if (lwVolChart) { lwVolChart.remove(); lwVolChart=null; }
  var isDark = window.matchMedia('(prefers-color-scheme:dark)').matches;
  var bg = isDark?'#1a1a1a':'#ffffff';
  var tc = isDark?'#aaaaaa':'#666666';
  var gc = isDark?'rgba(255,255,255,.06)':'rgba(0,0,0,.06)';
  var baseOpts = {
    layout:{background:{color:bg},textColor:tc},
    grid:{vertLines:{color:gc},horzLines:{color:gc}},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
    rightPriceScale:{borderColor:gc},
    timeScale:{borderColor:gc,timeVisible:true},
    handleScroll:true, handleScale:true
  };
  var pe = document.getElementById('priceChart');
  pe.innerHTML = '';
  var chartOpts = {};
  for (var k in baseOpts) chartOpts[k] = baseOpts[k];
  chartOpts.height = 260;
  lwChart = LightweightCharts.createChart(pe, chartOpts);
  var cs = lwChart.addCandlestickSeries({upColor:'#1a9e75',downColor:'#d85a30',borderUpColor:'#1a9e75',borderDownColor:'#d85a30',wickUpColor:'#1a9e75',wickDownColor:'#d85a30'});
  var es = lwChart.addLineSeries({color:'#185fa5',lineWidth:1.5,priceLineVisible:false,lastValueVisible:false});
  var ve = document.getElementById('volumeChart');
  ve.innerHTML = '';
  var volOpts = {};
  for (var k in baseOpts) volOpts[k] = baseOpts[k];
  volOpts.height = 80;
  volOpts.timeScale = {visible:false};
  lwVolChart = LightweightCharts.createChart(ve, volOpts);
  var vs = lwVolChart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'right'});
  var ts=d.timestamps||[], opens=d.opens||d.closes, highs=d.highs||d.closes, lows=d.lows||d.closes;
  var closes=d.closes, volumes=d.volumes||[], ema20=d.ema20||[];
  var cd=[],ed=[],vd=[];
  for (var i=0;i<ts.length;i++) {
    if (!closes[i]) continue;
    var o=opens[i]||closes[i],h=highs[i]||closes[i],l=lows[i]||closes[i],c=closes[i],v=volumes[i]||0;
    cd.push({time:ts[i],open:parseFloat(o.toFixed(4)),high:parseFloat(h.toFixed(4)),low:parseFloat(l.toFixed(4)),close:parseFloat(c.toFixed(4))});
    vd.push({time:ts[i],value:v,color:c>=o?'rgba(26,158,117,.6)':'rgba(216,90,48,.6)'});
    if (ema20[i]) ed.push({time:ts[i],value:parseFloat(ema20[i].toFixed(4))});
  }
  cs.setData(cd); es.setData(ed); vs.setData(vd);
  lwChart.timeScale().subscribeVisibleLogicalRangeChange(function(r){if(lwVolChart&&r)lwVolChart.timeScale().setVisibleLogicalRange(r);});
  lwVolChart.timeScale().subscribeVisibleLogicalRangeChange(function(r){if(lwChart&&r)lwChart.timeScale().setVisibleLogicalRange(r);});
  lwChart.timeScale().fitContent();
  lwVolChart.timeScale().fitContent();
}

// factors
function renderFactors(d) {
  document.getElementById('factorGrid').classList.add('visible');
  var rsi = d.rsiLatest || 50;
  var e20 = validArr(d.ema20).slice(-1)[0] || 0;
  var tech = Math.min(10,Math.max(1,Math.round((rsi<30?8:rsi>70?3:5)+(d.price>e20?2:0)-1)));
  var vol = Math.min(10,Math.max(1,Math.round(d.volRatio>2?8:d.volRatio>1.5?6:d.volRatio>1?5:3)));
  var inst = Math.floor(Math.random()*4)+5;
  var sent = Math.floor(Math.random()*4)+4;
  var overall = Math.round((tech+vol+inst+sent)/4);
  function sf(id,score,label) {
    document.getElementById('fv-'+id).textContent=score+'/10';
    document.getElementById('fb-'+id).style.width=(score*10)+'%';
    document.getElementById('fl-'+id).textContent=label;
  }
  sf('tech',tech,rsi<30?'Oversold':rsi>70?'Overbought':'Neutral');
  sf('vol',vol,d.volRatio>1.5?'High volume':'Normal');
  sf('inst',inst,inst>=7?'Buying':'Neutral');
  sf('sent',sent,sent>=7?'Bullish':'Neutral');
  sf('overall',overall,overall>=7?'Bullish':overall>=5?'Neutral':'Bearish');
}

// TWSE
function loadTWSE(stockNo) {
  var panel=document.getElementById('instPanel'),grid=document.getElementById('instGrid'),total=document.getElementById('instTotal');
  panel.classList.add('visible');
  document.getElementById('instTitle').textContent = stockNo + ' 三大法人';
  grid.innerHTML = '<span style="font-size:12px;color:var(--muted)">Loading...</span>';
  fetch('/api/twse?stockNo='+encodeURIComponent(stockNo))
    .then(function(r){return r.json();})
    .then(function(d){
      if (d.error) throw new Error(d.error);
      document.getElementById('instDate').textContent = d.date.replace(/(\d{4})(\d{2})(\d{2})/,'$1/$2/$3');
      function fmt(n) {
        if (n===0) return '<span style="color:var(--muted)">0</span>';
        var c=n>0?'var(--up)':'var(--down)', s=n>0?'+':'';
        return '<span style="color:'+c+'">'+s+n.toLocaleString()+'</span>';
      }
      var rows = [{name:'外資',data:d.foreign},{name:'投信',data:d.trust},{name:'自營商',data:d.dealer}];
      var html = '';
      for (var i=0;i<rows.length;i++) {
        html += '<div class="inst-card"><div class="inst-name">'+rows[i].name+'</div><div class="inst-net">'+fmt(rows[i].data.net)+' 張</div><div class="inst-detail">買 '+rows[i].data.buy.toLocaleString()+' / 賣 '+rows[i].data.sell.toLocaleString()+'</div></div>';
      }
      grid.innerHTML = html;
      var tc=d.total>0?'var(--up)':d.total<0?'var(--down)':'var(--muted)', ts=d.total>0?'+':'';
      total.innerHTML='<span style="font-size:12px;color:var(--muted)">三大法人合計</span><span style="font-size:18px;font-weight:500;font-family:var(--mono);color:'+tc+'">'+ts+d.total.toLocaleString()+' 張</span>';
    })
    .catch(function(e){grid.innerHTML='<span style="font-size:12px;color:var(--muted)">'+e.message+'</span>';});
}

// Claude analysis
function runClaude(d) {
  var panel=document.getElementById('aiPanel'),output=document.getElementById('aiOutput');
  panel.classList.add('visible');
  document.getElementById('aiTitle').textContent = d.name + ' (' + d.ticker + ')';
  output.innerHTML = '<span class="spinner"></span> Analyzing...';
  var e20 = (validArr(d.ema20).slice(-1)[0]||0).toFixed(2);
  var prompt = 'Stock: '+d.ticker+' '+d.name+'\n'
    +'Price: '+d.price.toFixed(2)+' '+d.currency+' | Change: '+(d.chgAbs>=0?'+':'')+d.chgAbs.toFixed(2)+' ('+d.chgPct.toFixed(2)+'%)\n'
    +'RSI: '+(d.rsiLatest?d.rsiLatest.toFixed(1):'N/A')+' | EMA20: '+e20+' | Above EMA20: '+(d.price>parseFloat(e20)?'Yes':'No')+'\n'
    +'Volume ratio: '+(d.volRatio?d.volRatio.toFixed(2):'N/A')+'x\n'
    +'Please provide in Traditional Chinese: 1) Bull/Bear score (1-10) 2) Technical analysis 3) Volume analysis 4) Trade recommendation 5) Key risks';
  fetch('/api/analyze',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      model:'claude-sonnet-4-6', max_tokens:600,
      system:'You are a stock analyst. Respond in Traditional Chinese. Be concise, 1-2 sentences per point.',
      messages:[{role:'user',content:prompt}]
    })
  })
  .then(function(r){return r.json();})
  .then(function(json){
    if (!json.content) throw new Error(JSON.stringify(json));
    var text = '';
    for (var i=0;i<json.content.length;i++) {
      if (json.content[i].type==='text') text += json.content[i].text;
    }
    var lines = text.split('\n');
    var html = '';
    for (var i=0;i<lines.length;i++) {
      if (lines[i].trim()) html += '<p>'+lines[i]+'</p>';
    }
    var up=d.chgPct>=1,dn=d.chgPct<=-1;
    html += '<div class="verdict-row"><span style="font-size:12px;color:var(--muted)">Verdict: </span><span class="verdict-badge '+(up?'v-bull':dn?'v-bear':'v-neu')+'">'+(up?'Bullish':dn?'Bearish':'Neutral')+'</span></div>';
    output.innerHTML = html;
  })
  .catch(function(e){output.innerHTML='<span style="color:#a32d2d">Error: '+e.message+'</span>';});
}

// briefing
function generateBriefing() {
  var btn=document.getElementById('briefBtn');
  var panel=document.getElementById('briefPanel');
  var bc=document.getElementById('briefContent');
  var timeEl=document.getElementById('briefTime');
  btn.disabled=true; btn.textContent='Loading OUST...';
  panel.classList.add('visible');
  bc.innerHTML='<span class="spinner"></span> Fetching OUST data...';
  var now=new Date();
  var timeStr=now.toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  timeEl.textContent=timeStr+' Taipei';
  var stockData = null;
  fetch('/api/stock?ticker=OUST&interval=1d')
    .then(function(r){return r.json();})
    .then(function(j){
      stockData = parseYahoo('OUST',j);
      btn.textContent='Loading news...';
      bc.innerHTML='<span class="spinner"></span> Fetching Finnhub data...';
      return fetch('/api/news?symbol=OUST').then(function(nr){return nr.json();}).catch(function(){return {};});
    })
    .then(function(nd){
      btn.textContent='Claude analyzing...';
      bc.innerHTML='<span class="spinner"></span> Claude analyzing...';
      var d = stockData;
      var newsStr = '';
      if (nd && nd.priceTarget && nd.priceTarget.mean) {
        newsStr += '\nAnalyst target: avg $'+nd.priceTarget.mean+', high $'+nd.priceTarget.high+', low $'+nd.priceTarget.low;
      }
      if (nd && nd.latestRec && nd.latestRec.period) {
        newsStr += '\nRatings ('+nd.latestRec.period+'): Buy '+(nd.latestRec.buy||0)+(nd.latestRec.strongBuy||0)+', Hold '+(nd.latestRec.hold||0)+', Sell '+(nd.latestRec.sell||0);
      }
      if (nd && nd.news && nd.news.length>0) {
        newsStr += '\nRecent news:';
        for (var i=0;i<nd.news.length;i++) newsStr += '\n- ['+nd.news[i].date+'] '+nd.news[i].headline;
      }
      if (!newsStr) newsStr = '\n(Finnhub API key not set)';
      var e20 = validArr(d.ema20).slice(-1)[0]||0;
      var prompt = 'OUST (Ouster) pre-market analysis ('+timeStr+' Taipei):\n'
        +'Price: $'+d.price.toFixed(2)+' ('+( d.chgPct>=0?'+':'')+d.chgPct+'%)\n'
        +'RSI: '+(d.rsiLatest?d.rsiLatest.toFixed(1):'N/A')+'\n'
        +'EMA20: '+(d.price>e20?'Above (bullish)':'Below (bearish)')+'\n'
        +newsStr+'\n\n'
        +'Please respond in Traditional Chinese with these 4 sections (1-2 sentences each):\n'
        +'1. Bull/Bear score (1-10) and reasoning\n'
        +'2. Recent catalysts (news and analyst updates)\n'
        +'3. Trade recommendation\n'
        +'4. Key risks';
      return fetch('/api/analyze',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          model:'claude-sonnet-4-6', max_tokens:600,
          system:'You are a stock analyst. Respond entirely in Traditional Chinese. Be concise.',
          messages:[{role:'user',content:prompt}]
        })
      });
    })
    .then(function(r){return r.json();})
    .then(function(json){
      if (!json.content) throw new Error(JSON.stringify(json));
      var text='';
      for (var i=0;i<json.content.length;i++){
        if (json.content[i].type==='text') text+=json.content[i].text;
      }
      var lines=text.split('\n');
      var html='';
      for (var i=0;i<lines.length;i++){
        var l=lines[i].trim();
        if (!l) continue;
        if (l.match(/^[1-4]\./) || l.match(/^[0-9]+\./)) html+='<h3>'+l+'</h3>';
        else html+='<p>'+l+'</p>';
      }
      bc.innerHTML=html+'<p style="margin-top:14px;font-size:11px;color:var(--hint)">For reference only. Not investment advice.</p>';
      btn.disabled=false; btn.textContent='Refresh Briefing';
    })
    .catch(function(e){
      bc.innerHTML='<span style="color:var(--down)">Error: '+e.message+'</span>';
      btn.disabled=false; btn.textContent='Retry';
    });
}
